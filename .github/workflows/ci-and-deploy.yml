name: CI and Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build (staging)
        run: npm run build
      - name: Test
        run: npm test

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build (production)
        run: npm run build:prod
      - name: Check links (production)
        run: SITE_ENV=production node scripts/check-links.js
      - name: Check JSON-LD schemas (production)
        run: SITE_ENV=production node scripts/check-schema.js
      - name: Check SEO (production)
        run: SITE_ENV=production node scripts/check-seo.js
      - name: Assert no noindex in homepage & robots.txt allows all
        run: |
          if grep -qi 'noindex' _site/index.html; then
            echo "❌ _site/index.html contains noindex — aborting deploy"
            exit 1
          fi
          if ! grep -q 'Allow: /' _site/robots.txt; then
            echo "❌ _site/robots.txt does not contain 'Allow: /' — aborting deploy"
            exit 1
          fi
          echo "✅ Homepage has no noindex; robots.txt contains Allow: /"
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
