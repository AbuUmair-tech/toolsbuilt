<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="56" y="74" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="34" font-weight="800" fill="#0f172a">अलग कुल अंकों वाले प्रतिशतों का औसत न निकालें</text>
  <text x="56" y="112" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="21" font-weight="400" fill="#475569">क्लास टेस्ट में 18/20 और फ़ाइनल परीक्षा में 60/100</text>
  
  
  <rect x="56" y="150" width="528" height="186" rx="18" fill="#ffedde"/>
  <text x="84" y="196" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="22" font-weight="700" fill="#c2410c">गलत: दोनों प्रतिशतों का औसत</text>
  <text x="84" y="250" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="30" font-weight="800" fill="#0f172a">(90% + 60%) ÷ 2</text>
  <text x="84" y="296" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="20" font-weight="400" fill="#475569">= 75%, जो 20 अंकों के टेस्ट को परीक्षा के बराबर मानता है</text>
  
  <rect x="616" y="150" width="528" height="186" rx="18" fill="#e3f7ea"/>
  <text x="644" y="196" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="22" font-weight="700" fill="#15803d">सही: पहले अंक जोड़ें</text>
  <text x="644" y="250" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="30" font-weight="800" fill="#0f172a">(18 + 60) ÷ (20 + 100)</text>
  <text x="644" y="296" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="20" font-weight="400" fill="#475569">= 78 ÷ 120 × 100 = 65%</text>
  <text x="56" y="410" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="22" font-weight="400" fill="#0f172a">20 अंकों का टेस्ट कुल 120 अंकों का छठा हिस्सा है, इसलिए नतीजे पर उसका असर थोड़ा होना चाहिए।</text>
  <text x="56" y="446" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="22" font-weight="400" fill="#0f172a">औसत निकालने से उसे परीक्षा जितना वज़न मिलता है और नतीजा 10 अंक ज़्यादा आता है।</text>
  <text x="56" y="520" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="21" font-weight="400" fill="#475569">बराबर कुल अंक (जैसे FSc पार्ट 1 और पार्ट 2, दोनों 550 के) ही वह स्थिति है जहाँ औसत सही बैठता है।</text>
  <text x="1144" y="645" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
</svg>