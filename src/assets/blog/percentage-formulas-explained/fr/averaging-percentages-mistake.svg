<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="56" y="74" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0f172a">Pas de moyenne de pourcentages aux totaux différents</text>
  <text x="56" y="112" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#475569">Un contrôle à 18/20 et un examen final à 60/100</text>
  
  
  <rect x="56" y="150" width="528" height="186" rx="18" fill="#ffedde"/>
  <text x="84" y="196" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#c2410c">Faux : moyenne des deux pourcentages</text>
  <text x="84" y="250" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f172a">(90% + 60%) ÷ 2</text>
  <text x="84" y="296" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#475569">= 75%, comme si le contrôle sur 20 valait l'examen</text>
  
  <rect x="616" y="150" width="528" height="186" rx="18" fill="#e3f7ea"/>
  <text x="644" y="196" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#15803d">Juste : additionner d'abord les points</text>
  <text x="644" y="250" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f172a">(18 + 60) ÷ (20 + 100)</text>
  <text x="644" y="296" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#475569">= 78 ÷ 120 × 100 = 65%</text>
  <text x="56" y="410" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#0f172a">Le contrôle sur 20 points ne pèse qu'un sixième des 120 points en jeu : il doit peu influer sur le résultat.</text>
  <text x="56" y="446" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#0f172a">La moyenne lui donne autant de poids qu'à l'examen et gonfle le résultat de 10 points.</text>
  <text x="56" y="520" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#475569">Avec des totaux égaux (FSc partie 1 et partie 2, 550 chacune), la moyenne tombe juste.</text>
  <text x="1144" y="645" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
</svg>