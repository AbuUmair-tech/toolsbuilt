<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="56" y="74" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0f172a">Cuatro fórmulas de porcentaje que sirven para casi todo</text>
  <text x="56" y="112" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#475569">Calificaciones, descuentos, cambios de precio y el precio original a partir de la oferta</text>
  
  
  <rect x="56" y="146" width="528" height="186" rx="18" fill="#e8f0ff"/>
  <text x="84" y="192" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#2563eb">Calificaciones: ¿qué porcentaje saqué?</text>
  <text x="84" y="246" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f172a">obtenidas ÷ total × 100</text>
  <text x="84" y="292" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#475569">912 ÷ 1100 × 100 = 82.91%</text>
  
  <rect x="616" y="146" width="528" height="186" rx="18" fill="#e3f7ea"/>
  <text x="644" y="192" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#15803d">Descuento: precio tras el % de rebaja</text>
  <text x="644" y="246" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f172a">precio × (1 − % ÷ 100)</text>
  <text x="644" y="292" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#475569">2,400 × (1 − 0.15) = Rs 2,040</text>
  
  <rect x="56" y="356" width="528" height="186" rx="18" fill="#ffedde"/>
  <text x="84" y="402" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#c2410c">Variación: ¿cuánto subió?</text>
  <text x="84" y="456" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="27.5" font-weight="800" fill="#0f172a">(nuevo − anterior) ÷ anterior × 100</text>
  <text x="84" y="502" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#475569">(46,000 − 40,000) ÷ 40,000 = 15%</text>
  
  <rect x="616" y="356" width="528" height="186" rx="18" fill="#f3e8ff"/>
  <text x="644" y="402" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#9333ea">Inverso: precio antes del descuento</text>
  <text x="644" y="456" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f172a">oferta ÷ (1 − % ÷ 100)</text>
  <text x="644" y="502" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#475569">2,040 ÷ 0.85 = Rs 2,400</text>
  <text x="56" y="600" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#0f172a">Divide siempre entre el valor de partida: la base es donde fallan estas cuentas.</text>
  <text x="1144" y="645" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
</svg>