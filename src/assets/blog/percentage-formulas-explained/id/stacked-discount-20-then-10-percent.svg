<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="56" y="74" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0f172a">Diskon 20% lalu diskon 10% bukan diskon 30%</text>
  <text x="56" y="112" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#475569">Barang seharga Rs 5,000 dengan dua diskon yang diterapkan berurutan</text>
  
  <text x="56" y="200" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0f172a">Harga awal</text>
  <rect x="300" y="160" width="680" height="60" rx="10" fill="#64748b"/>
  <text x="996" y="200" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#64748b">Rs 5,000</text>
  
  <text x="56" y="300" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0f172a">Setelah diskon 20%</text>
  <rect x="300" y="260" width="544" height="60" rx="10" fill="#2563eb"/>
  <text x="860" y="300" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#2563eb">Rs 4,000</text>
  <text x="300" y="348" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#475569">20% dari 5,000 = potongan Rs 1,000</text>
  <text x="56" y="420" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0f172a">Lalu diskon 10%</text>
  <rect x="300" y="380" width="489.6" height="60" rx="10" fill="#15803d"/>
  <text x="805.6" y="420" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#15803d">Rs 3,600</text>
  <text x="300" y="468" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#475569">10% dari 4,000 (bukan 5,000) = potongan Rs 400. Total hemat: 28%</text>
  <text x="56" y="540" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0f172a">Jika benar 30%</text>
  <rect x="300" y="500" width="476.00000000000006" height="60" rx="10" fill="#c2410c"/>
  <text x="792" y="540" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#c2410c">Rs 3,500</text>
  <text x="300" y="588" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#475569">Diskon langsung 30%. Dua diskon tadi membuat Anda bayar Rs 100 lebih mahal.</text>
  <text x="1144" y="645" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
</svg>