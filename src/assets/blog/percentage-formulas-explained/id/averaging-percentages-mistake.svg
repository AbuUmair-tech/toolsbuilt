<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="56" y="74" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0f172a">Jangan rata-ratakan persentase dengan total berbeda</text>
  <text x="56" y="112" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#475569">Ulangan kelas 18/20 dan ujian akhir 60/100</text>
  
  
  <rect x="56" y="150" width="528" height="186" rx="18" fill="#ffedde"/>
  <text x="84" y="196" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#c2410c">Salah: merata-ratakan dua persentase</text>
  <text x="84" y="250" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f172a">(90% + 60%) ÷ 2</text>
  <text x="84" y="296" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="19.5" font-weight="400" fill="#475569">= 75%, seolah ulangan bernilai 20 setara ujian akhir</text>
  
  <rect x="616" y="150" width="528" height="186" rx="18" fill="#e3f7ea"/>
  <text x="644" y="196" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#15803d">Benar: jumlahkan nilainya dulu</text>
  <text x="644" y="250" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f172a">(18 + 60) ÷ (20 + 100)</text>
  <text x="644" y="296" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#475569">= 78 ÷ 120 × 100 = 65%</text>
  <text x="56" y="410" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#0f172a">Ulangan bernilai 20 hanya seperenam dari total 120, jadi pengaruhnya pada hasil kecil saja.</text>
  <text x="56" y="446" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#0f172a">Merata-ratakan memberinya bobot setara ujian akhir dan menaikkan hasil 10 poin.</text>
  <text x="56" y="520" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#475569">Rata-rata hanya cocok jika totalnya sama, seperti FSc Part 1 dan Part 2 (masing-masing 550).</text>
  <text x="1144" y="645" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
</svg>