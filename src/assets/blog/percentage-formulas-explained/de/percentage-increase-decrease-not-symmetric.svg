<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="56" y="74" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0f172a">Erst 15% rauf, dann zurück: warum es nur 13.04% sind</text>
  <text x="56" y="112" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#475569">Die Miete steigt von Rs 40,000 auf Rs 46,000 und sinkt später wieder auf Rs 40,000</text>
  
  <rect x="96" y="256" width="220" height="304" rx="12" fill="#2563eb"/>
  <rect x="490" y="210.39999999999998" width="220" height="349.6" rx="12" fill="#c2410c"/>
  <rect x="884" y="256" width="220" height="304" rx="12" fill="#2563eb"/>
  <text x="206" y="596" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Vorher: Rs 40,000</text>
  <text x="600" y="596" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Erhöht: Rs 46,000</text>
  <text x="994" y="596" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Zurück: Rs 40,000</text>
  <text x="403" y="230" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#c2410c" text-anchor="middle">+15%</text>
  <text x="403" y="262" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="middle">6,000 ÷ 40,000</text>
  <text x="797" y="230" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#2563eb" text-anchor="middle">-13.04%</text>
  <text x="797" y="262" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="middle">6,000 ÷ 46,000</text>
  <text x="1144" y="645" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
