<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1144" y="74" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="27.200000000000003" font-weight="800" fill="#0f172a" direction="rtl">فیصد کے چار فارمولے جو تقریباً ہر حساب کے لیے کافی ہیں</text>
  <text x="1144" y="112" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16.8" font-weight="400" fill="#475569" direction="rtl">نمبر، ڈسکاؤنٹ، قیمت کی تبدیلی اور سیل کی قیمت سے الٹا حساب</text>
  
  
  <rect x="616" y="146" width="528" height="186" rx="18" fill="#e8f0ff"/>
  <text x="1116" y="192" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="17.6" font-weight="700" fill="#2563eb" direction="rtl">نمبر: میرا فیصد کتنا بنا؟</text>
  <text x="1116" y="246" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="24" font-weight="800" fill="#0f172a" direction="rtl">حاصل کردہ ÷ کل × 100</text>
  <text x="1116" y="292" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="end">912 ÷ 1100 × 100 = 82.91%</text>
  
  <rect x="56" y="146" width="528" height="186" rx="18" fill="#e3f7ea"/>
  <text x="556" y="192" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="17.6" font-weight="700" fill="#15803d" direction="rtl">ڈسکاؤنٹ: % کٹوتی کے بعد قیمت</text>
  <text x="556" y="246" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="24" font-weight="800" fill="#0f172a" direction="rtl">قیمت × (1 − % ÷ 100)</text>
  <text x="556" y="292" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="end">2,400 × (1 − 0.15) = Rs 2,040</text>
  
  <rect x="616" y="356" width="528" height="186" rx="18" fill="#ffedde"/>
  <text x="1116" y="402" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="17.6" font-weight="700" fill="#c2410c" direction="rtl">تبدیلی: کتنا اضافہ ہوا؟</text>
  <text x="1116" y="456" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="24" font-weight="800" fill="#0f172a" direction="rtl">(نئی − پرانی) ÷ پرانی × 100</text>
  <text x="1116" y="502" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="end">(46,000 − 40,000) ÷ 40,000 = 15%</text>
  
  <rect x="56" y="356" width="528" height="186" rx="18" fill="#f3e8ff"/>
  <text x="556" y="402" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="17.6" font-weight="700" fill="#9333ea" direction="rtl">الٹا: % کٹوتی سے پہلے کی قیمت</text>
  <text x="556" y="456" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="24" font-weight="800" fill="#0f172a" direction="rtl">سیل ÷ (1 − % ÷ 100)</text>
  <text x="556" y="502" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="end">2,040 ÷ 0.85 = Rs 2,400</text>
  <text x="1144" y="600" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16.8" font-weight="600" fill="#0f172a" direction="rtl">ہمیشہ ابتدائی قدر سے تقسیم کریں: زیادہ تر غلطیاں بنیاد ہی میں ہوتی ہیں۔</text>
  <text x="1144" y="645" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
</svg>