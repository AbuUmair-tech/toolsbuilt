<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1144" y="74" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="27.200000000000003" font-weight="800" fill="#0f172a" direction="rtl">پہلے 20% اور پھر 10% ڈسکاؤنٹ، 30% نہیں بنتا</text>
  <text x="1144" y="112" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16.8" font-weight="400" fill="#475569" direction="rtl">Rs 5,000 کی چیز، جس پر ایک کے بعد ایک دو ڈسکاؤنٹ لگے</text>
  
  <text x="1144" y="200" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="17.6" font-weight="700" fill="#0f172a" direction="rtl">اصل قیمت</text>
  <rect x="220" y="160" width="680" height="60" rx="10" fill="#64748b"/>
  <text x="204" y="200" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="19.200000000000003" font-weight="800" fill="#64748b" text-anchor="end">Rs 5,000</text>
  
  <text x="1144" y="300" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="17.6" font-weight="700" fill="#0f172a" direction="rtl">20% ڈسکاؤنٹ کے بعد</text>
  <rect x="356" y="260" width="544" height="60" rx="10" fill="#2563eb"/>
  <text x="340" y="300" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="19.200000000000003" font-weight="800" fill="#2563eb" text-anchor="end">Rs 4,000</text>
  <text x="900" y="348" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="15.200000000000001" font-weight="400" fill="#475569" direction="rtl">5,000 کا 20% = Rs 1,000 کم</text>
  <text x="1144" y="420" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="17.6" font-weight="700" fill="#0f172a" direction="rtl">پھر 10% ڈسکاؤنٹ</text>
  <rect x="410.4" y="380" width="489.6" height="60" rx="10" fill="#15803d"/>
  <text x="394.4" y="420" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="19.200000000000003" font-weight="800" fill="#15803d" text-anchor="end">Rs 3,600</text>
  <text x="900" y="468" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="15.200000000000001" font-weight="400" fill="#475569" direction="rtl">4,000 کا 10% (5,000 کا نہیں) = Rs 400 کم۔ کل بچت: 28%</text>
  <text x="1144" y="540" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="17.6" font-weight="700" fill="#0f172a" direction="rtl">اگر 30% ہوتا</text>
  <rect x="423.99999999999994" y="500" width="476.00000000000006" height="60" rx="10" fill="#c2410c"/>
  <text x="408" y="540" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="19.200000000000003" font-weight="800" fill="#c2410c" text-anchor="end">Rs 3,500</text>
  <text x="900" y="588" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="15.200000000000001" font-weight="400" fill="#475569" direction="rtl">سیدھا 30% ڈسکاؤنٹ۔ دو ڈسکاؤنٹس میں آپ Rs 100 زیادہ دیتے ہیں۔</text>
  <text x="1144" y="645" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
