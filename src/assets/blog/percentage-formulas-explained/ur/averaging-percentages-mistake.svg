<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1144" y="74" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="27.200000000000003" font-weight="800" fill="#0f172a" direction="rtl">مختلف کل نمبروں والے فیصدوں کی اوسط نہ نکالیں</text>
  <text x="1144" y="112" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16.8" font-weight="400" fill="#475569" direction="rtl">کلاس ٹیسٹ میں 18/20 اور فائنل امتحان میں 60/100</text>
  
  
  <rect x="616" y="150" width="528" height="186" rx="18" fill="#ffedde"/>
  <text x="1116" y="196" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="17.6" font-weight="700" fill="#c2410c" direction="rtl">غلط: دونوں فیصدوں کی اوسط</text>
  <text x="1116" y="250" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="24" font-weight="800" fill="#0f172a" text-anchor="end">(90% + 60%) ÷ 2</text>
  <text x="1116" y="296" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16" font-weight="400" fill="#475569" direction="rtl">= 75%، جو 20 نمبر کے ٹیسٹ کو امتحان کے برابر سمجھتی ہے</text>
  
  <rect x="56" y="150" width="528" height="186" rx="18" fill="#e3f7ea"/>
  <text x="556" y="196" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="17.6" font-weight="700" fill="#15803d" direction="rtl">درست: پہلے نمبر جمع کریں</text>
  <text x="556" y="250" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="24" font-weight="800" fill="#0f172a" text-anchor="end">(18 + 60) ÷ (20 + 100)</text>
  <text x="556" y="296" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="end">= 78 ÷ 120 × 100 = 65%</text>
  <text x="1144" y="410" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="17.6" font-weight="400" fill="#0f172a" direction="rtl">20 نمبر کا ٹیسٹ کل 120 نمبروں کا چھٹا حصہ ہے، اس لیے نتیجے پر اس کا اثر تھوڑا ہونا چاہیے۔</text>
  <text x="1144" y="446" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="17.6" font-weight="400" fill="#0f172a" direction="rtl">اوسط اسے امتحان جتنا وزن دیتی ہے اور نتیجہ 10 پوائنٹس بڑھا دیتی ہے۔</text>
  <text x="1144" y="520" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16.8" font-weight="400" fill="#475569" direction="rtl">کل نمبر برابر ہوں (جیسے FSc پارٹ 1 اور پارٹ 2، 550 ہر ایک) تو ہی اوسط درست آتی ہے۔</text>
  <text x="1144" y="645" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
</svg>