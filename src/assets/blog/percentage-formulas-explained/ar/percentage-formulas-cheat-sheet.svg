<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1144" y="74" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="34" font-weight="800" fill="#0f172a" direction="rtl">أربع معادلات للنسبة المئوية تغطي كل شيء تقريبًا</text>
  <text x="1144" y="112" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="21" font-weight="400" fill="#475569" direction="rtl">الدرجات والخصومات وتغيّر الأسعار والرجوع من سعر التخفيض إلى الأصل</text>
  
  
  <rect x="616" y="146" width="528" height="186" rx="18" fill="#e8f0ff"/>
  <text x="1116" y="192" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="22" font-weight="700" fill="#2563eb" direction="rtl">الدرجات: كم نسبتي؟</text>
  <text x="1116" y="246" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="30" font-weight="800" fill="#0f172a" direction="rtl">المحصّلة ÷ الكلية × 100</text>
  <text x="1116" y="292" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="end">912 ÷ 1100 × 100 = 82.91%</text>
  
  <rect x="56" y="146" width="528" height="186" rx="18" fill="#e3f7ea"/>
  <text x="556" y="192" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="22" font-weight="700" fill="#15803d" direction="rtl">الخصم: السعر بعد الخصم</text>
  <text x="556" y="246" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="30" font-weight="800" fill="#0f172a" direction="rtl">السعر × (1 − % ÷ 100)</text>
  <text x="556" y="292" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="end">2,400 × (1 − 0.15) = Rs 2,040</text>
  
  <rect x="616" y="356" width="528" height="186" rx="18" fill="#ffedde"/>
  <text x="1116" y="402" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="22" font-weight="700" fill="#c2410c" direction="rtl">التغيّر: بكم ارتفع؟</text>
  <text x="1116" y="456" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="30" font-weight="800" fill="#0f172a" direction="rtl">(الجديدة − القديمة) ÷ القديمة × 100</text>
  <text x="1116" y="502" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="end">(46,000 − 40,000) ÷ 40,000 = 15%</text>
  
  <rect x="56" y="356" width="528" height="186" rx="18" fill="#f3e8ff"/>
  <text x="556" y="402" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="22" font-weight="700" fill="#9333ea" direction="rtl">العكس: السعر قبل الخصم</text>
  <text x="556" y="456" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="30" font-weight="800" fill="#0f172a" direction="rtl">المخفّض ÷ (1 − % ÷ 100)</text>
  <text x="556" y="502" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="end">2,040 ÷ 0.85 = Rs 2,400</text>
  <text x="1144" y="600" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="21" font-weight="600" fill="#0f172a" direction="rtl">اقسم دائمًا على القيمة التي بدأت منها: فالأساس هو موضع الخطأ في هذه الحسابات.</text>
  <text x="1144" y="645" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
</svg>