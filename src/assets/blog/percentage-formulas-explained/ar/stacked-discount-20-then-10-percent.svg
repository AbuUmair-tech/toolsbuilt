<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1144" y="74" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="34" font-weight="800" fill="#0f172a" direction="rtl">خصم 20% ثم خصم 10% لا يساوي خصم 30%</text>
  <text x="1144" y="112" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="21" font-weight="400" fill="#475569" direction="rtl">سلعة سعرها Rs 5,000 عليها خصمان يُطبَّقان واحدًا تلو الآخر</text>
  
  <text x="1144" y="200" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="22" font-weight="700" fill="#0f172a" direction="rtl">السعر الأصلي</text>
  <rect x="220" y="160" width="680" height="60" rx="10" fill="#64748b"/>
  <text x="204" y="200" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="24" font-weight="800" fill="#64748b" text-anchor="end">Rs 5,000</text>
  
  <text x="1144" y="300" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="22" font-weight="700" fill="#0f172a" direction="rtl">بعد خصم 20%</text>
  <rect x="356" y="260" width="544" height="60" rx="10" fill="#2563eb"/>
  <text x="340" y="300" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="24" font-weight="800" fill="#2563eb" text-anchor="end">Rs 4,000</text>
  <text x="900" y="348" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="19" font-weight="400" fill="#475569" direction="rtl">20% من 5,000 = خصم Rs 1,000</text>
  <text x="1144" y="420" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="22" font-weight="700" fill="#0f172a" direction="rtl">ثم خصم 10%</text>
  <rect x="410.4" y="380" width="489.6" height="60" rx="10" fill="#15803d"/>
  <text x="394.4" y="420" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="24" font-weight="800" fill="#15803d" text-anchor="end">Rs 3,600</text>
  <text x="900" y="468" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="19" font-weight="400" fill="#475569" direction="rtl">10% من 4,000 (لا 5,000) = خصم Rs 400. إجمالي التوفير: 28%</text>
  <text x="1144" y="540" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="22" font-weight="700" fill="#0f172a" direction="rtl">لو كان 30%</text>
  <rect x="423.99999999999994" y="500" width="476.00000000000006" height="60" rx="10" fill="#c2410c"/>
  <text x="408" y="540" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="24" font-weight="800" fill="#c2410c" text-anchor="end">Rs 3,500</text>
  <text x="900" y="588" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="19" font-weight="400" fill="#475569" direction="rtl">خصم مباشر بنسبة 30%. والخصمان يجعلانك تدفع Rs 100 أكثر.</text>
  <text x="1144" y="645" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
