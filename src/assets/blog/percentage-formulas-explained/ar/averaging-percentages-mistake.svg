<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1144" y="74" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="34" font-weight="800" fill="#0f172a" direction="rtl">لا تأخذ متوسط نسب مئوية مجاميعها مختلفة</text>
  <text x="1144" y="112" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="21" font-weight="400" fill="#475569" direction="rtl">اختبار صفي 18/20 وامتحان نهائي 60/100</text>
  
  
  <rect x="616" y="150" width="528" height="186" rx="18" fill="#ffedde"/>
  <text x="1116" y="196" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="22" font-weight="700" fill="#c2410c" direction="rtl">خطأ: متوسط النسبتين</text>
  <text x="1116" y="250" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="30" font-weight="800" fill="#0f172a" text-anchor="end">(90% + 60%) ÷ 2</text>
  <text x="1116" y="296" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="20" font-weight="400" fill="#475569" direction="rtl">= 75%، وهذا يعامل اختبار الـ 20 درجة كالامتحان</text>
  
  <rect x="56" y="150" width="528" height="186" rx="18" fill="#e3f7ea"/>
  <text x="556" y="196" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="22" font-weight="700" fill="#15803d" direction="rtl">صواب: اجمع الدرجات أولًا</text>
  <text x="556" y="250" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="30" font-weight="800" fill="#0f172a" text-anchor="end">(18 + 60) ÷ (20 + 100)</text>
  <text x="556" y="296" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="end">= 78 ÷ 120 × 100 = 65%</text>
  <text x="1144" y="410" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="22" font-weight="400" fill="#0f172a" direction="rtl">اختبار الـ 20 درجة سدس الـ 120 درجة المتاحة، فينبغي ألا يحرّك النتيجة إلا قليلًا.</text>
  <text x="1144" y="446" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="22" font-weight="400" fill="#0f172a" direction="rtl">المتوسط يمنحه وزن الامتحان نفسه، فيضخّم النتيجة بمقدار 10 نقاط.</text>
  <text x="1144" y="520" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="21" font-weight="400" fill="#475569" direction="rtl">المجاميع المتساوية (كالجزأين 1 و2 في FSc، 550 لكل منهما) هي الحالة الوحيدة التي يتطابق فيها المتوسط.</text>
  <text x="1144" y="645" font-family="Inter, 'Noto Sans Arabic', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
</svg>