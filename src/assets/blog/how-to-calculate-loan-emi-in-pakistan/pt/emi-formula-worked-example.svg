<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="56" y="74" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0f172a">A fórmula da EMI aplicada a um empréstimo real</text>
  <text x="56" y="112" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#475569">Rs 1,500,000 emprestados a uma taxa de exemplo de 20% ao ano por 3 anos (36 meses)</text>
  
  <rect x="56" y="150" width="1088" height="132" rx="18" fill="#e8f0ff"/>
  <text x="600" y="236" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#2563eb" text-anchor="middle">EMI = P × r × (1 + r)ⁿ ÷ ((1 + r)ⁿ − 1)</text>
  <text x="80" y="340" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0f172a">P = 1,500,000</text><text x="80" y="372" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#475569">o valor que você pega emprestado</text>
  <text x="440" y="340" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0f172a">r = 20 ÷ 1200 = 0.016667</text><text x="440" y="372" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#475569">a taxa mensal, em decimal</text>
  <text x="840" y="340" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0f172a">n = 36</text><text x="840" y="372" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#475569">número de parcelas mensais</text>
  <line x1="56" y1="412" x2="1144" y2="412" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80" y="464" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#475569">(1 + r)ⁿ = 1.016667³⁶ = 1.8131</text>
  <text x="80" y="508" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#475569">EMI = 1,500,000 × 0.016667 × 1.8131 ÷ 0.8131</text>
  <text x="80" y="576" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#15803d">= Rs 55,745.38 por mês</text>
  <text x="80" y="616" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#475569">As 36 parcelas somam Rs 2,006,833.48: Rs 506,833.48 disso são juros</text>
  <text x="1144" y="645" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
</svg>