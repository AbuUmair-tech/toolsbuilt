<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1144" y="74" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="27.200000000000003" font-weight="800" fill="#0f172a" direction="rtl">EMI کا فارمولا، ایک حقیقی قرض کے ساتھ</text>
  <text x="1144" y="112" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16.8" font-weight="400" fill="#475569" direction="rtl">Rs 1,500,000 کا قرض، 20% سالانہ کی مثالی شرح پر 3 سال (36 مہینے) کے لیے</text>
  
  <rect x="56" y="150" width="1088" height="132" rx="18" fill="#e8f0ff"/>
  <text x="600" y="236" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="44" font-weight="800" fill="#2563eb" text-anchor="middle">EMI = P × r × (1 + r)ⁿ ÷ ((1 + r)ⁿ − 1)</text>
  <text x="1120" y="340" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="20.8" font-weight="700" fill="#0f172a" text-anchor="end">P = 1,500,000</text><text x="1120" y="372" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16" font-weight="400" fill="#475569" direction="rtl">قرض کی رقم</text>
  <text x="760" y="340" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="20.8" font-weight="700" fill="#0f172a" text-anchor="end">r = 20 ÷ 1200 = 0.016667</text><text x="760" y="372" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16" font-weight="400" fill="#475569" direction="rtl">ماہانہ شرح، اعشاریہ میں</text>
  <text x="360" y="340" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="20.8" font-weight="700" fill="#0f172a" text-anchor="end">n = 36</text><text x="360" y="372" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16" font-weight="400" fill="#475569" direction="rtl">ماہانہ قسطوں کی تعداد</text>
  <line x1="56" y1="412" x2="1144" y2="412" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1120" y="464" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="19.200000000000003" font-weight="400" fill="#475569" text-anchor="end">(1 + r)ⁿ = 1.016667³⁶ = 1.8131</text>
  <text x="1120" y="508" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="19.200000000000003" font-weight="400" fill="#475569" text-anchor="end">EMI = 1,500,000 × 0.016667 × 1.8131 ÷ 0.8131</text>
  <text x="1120" y="576" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="32" font-weight="800" fill="#15803d" direction="rtl">= Rs 55,745.38 ماہانہ</text>
  <text x="1120" y="616" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="16.8" font-weight="400" fill="#475569" direction="rtl">36 قسطوں کا مجموعہ Rs 2,006,833.48: اس میں سے Rs 506,833.48 سود ہے</text>
  <text x="1144" y="645" font-family="Inter, 'Noto Nastaliq Urdu', sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">toolsbuilt.com</text>
</svg>