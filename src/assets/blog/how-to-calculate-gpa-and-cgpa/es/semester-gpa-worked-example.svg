  <text x="56" y="170" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0f172a">Cálculo</text><text x="56" y="196" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#475569">Nota A- · Créditos: 3</text><rect x="330" y="152" width="305.25000000000006" height="40" rx="10" fill="#2563eb"/><text x="870" y="181" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0f172a">3.7 × 3 = 11.1</text><text x="56" y="246" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0f172a">Programación</text><text x="56" y="272" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#475569">Nota A · Créditos: 4</text><rect x="330" y="228" width="440" height="40" rx="10" fill="#9333ea"/><text x="870" y="257" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0f172a">4.0 × 4 = 16.0</text><text x="56" y="322" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0f172a">Física</text><text x="56" y="348" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#475569">Nota B+ · Créditos: 3</text><rect x="330" y="304" width="272.24999999999994" height="40" rx="10" fill="#c2410c"/><text x="870" y="333" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0f172a">3.3 × 3 = 9.9</text><text x="56" y="398" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0f172a">Inglés</text><text x="56" y="424" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#475569">Nota B · Créditos: 3</text><rect x="330" y="380" width="247.5" height="40" rx="10" fill="#15803d"/><text x="870" y="409" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0f172a">3.0 × 3 = 9.0</text><text x="56" y="474" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0f172a">Laboratorio de Física</text><text x="56" y="500" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#475569">Nota A · Créditos: 1</text><rect x="330" y="456" width="110" height="40" rx="10" fill="#2563eb"/><text x="870" y="485" font-family="Inter, 'Inter Variable', -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0f172a">4.0 × 1 = 4.0</text>
