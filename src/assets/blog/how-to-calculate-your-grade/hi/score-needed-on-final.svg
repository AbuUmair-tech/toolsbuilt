  <rect x="1" y="1" width="1198" height="673" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="56" y="74" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="34" font-weight="800" fill="#0f172a">30% वाले फ़ाइनल में कितना स्कोर चाहिए</text>
  <text x="56" y="112" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="21" font-weight="400" fill="#475569">कोर्स के 70% से 61.8 पॉइंट पहले ही मिल चुके हैं</text>
  
  <text x="56" y="186" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="22" font-weight="700" fill="#0f172a">90% (A-) के लिए</text><rect x="380" y="158" width="564" height="44" rx="10" fill="#c2410c"/><text x="956" y="188" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="24" font-weight="800" fill="#c2410c">94%</text><text x="56" y="266" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="22" font-weight="700" fill="#0f172a">87% (B+) के लिए</text><rect x="380" y="238" width="504" height="44" rx="10" fill="#2563eb"/><text x="896" y="268" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="24" font-weight="800" fill="#2563eb">84%</text><text x="56" y="346" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="22" font-weight="700" fill="#0f172a">80% (B-) के लिए</text><rect x="380" y="318" width="364.02" height="44" rx="10" fill="#2563eb"/><text x="756.02" y="348" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="24" font-weight="800" fill="#2563eb">60.67%</text><text x="56" y="426" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="22" font-weight="700" fill="#0f172a">70% (C-) के लिए</text><rect x="380" y="398" width="163.98" height="44" rx="10" fill="#15803d"/><text x="555.98" y="428" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="24" font-weight="800" fill="#15803d">27.33%</text><text x="56" y="506" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="22" font-weight="700" fill="#0f172a">60% (D-) के लिए</text><text x="380" y="506" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="21" font-weight="600" fill="#15803d">पहले से पक्का: फ़ाइनल से पहले ही 61.8 पॉइंट</text>
  <text x="56" y="600" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="21" font-weight="600" fill="#0f172a">फ़ाइनल में ज़रूरी स्कोर = (टारगेट − 61.8) ÷ 0.30</text>
