  <text x="56" y="560" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="21" font-weight="400" fill="#0f172a">पेज किसी भी वेबसाइट की तरह एक बार डाउनलोड होता है। उसके बाद नतीजे के लिए कोई नेटवर्क रिक्वेस्ट नहीं चाहिए।</text>
  <text x="56" y="596" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="21" font-weight="400" fill="#475569">एनालिटिक्स, अगर आप स्वीकार करें, पेज विज़िट गिनता है, आपकी टाइप की हुई चीज़ें नहीं।</text>
