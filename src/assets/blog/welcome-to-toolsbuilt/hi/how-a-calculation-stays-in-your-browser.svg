  <text x="56" y="74" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="34" font-weight="800" fill="#0f172a">टूल इस्तेमाल करते समय आपकी संख्याएँ कहाँ जाती हैं</text>
  <text x="56" y="112" font-family="Inter, 'Noto Sans Devanagari', sans-serif" font-size="21" font-weight="400" fill="#475569">गणना आपके अपने डिवाइस पर होती है</text>
  
