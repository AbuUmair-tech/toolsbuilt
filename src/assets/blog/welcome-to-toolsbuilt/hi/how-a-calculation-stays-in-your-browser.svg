  <line x1="294" y1="310" x2="318" y2="310" stroke="#475569" stroke-width="4"/><polygon points="330,310 314,301 314,319" fill="#475569"/><line x1="550" y1="310" x2="574" y2="310" stroke="#475569" stroke-width="4"/><polygon points="586,310 570,301 570,319" fill="#475569"/>
